<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="/assets/img/logo.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso administrador | Dígalo con Flores</title>
<link rel="stylesheet" href="/css/design-system.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">

<div class="login-shell">
  <form id="login-form" class="login-card card-editorial">
    <img src="/assets/img/logo.png" class="brand-mark" alt="Dígalo con Flores" style="width:64px;height:64px;margin:0 auto 1rem;" />
    <p class="logo-mark" style="color:var(--green-deep);margin-bottom:0.3rem;">Dígalo <span style="color:var(--gold)">con</span> Flores</p>
    <p class="eyebrow" style="margin-bottom:1rem;">Panel administrativo</p>
    <div id="login-error" class="form-message error" style="display:none;"></div>
    <div class="field" style="text-align:left;"><label for="email">Correo</label><input id="email" type="email" required /></div>
    <div class="field" style="text-align:left;"><label for="password">Contraseña</label><input id="password" type="password" required /></div>
    <button type="submit" class="btn btn-primary btn-full">Entrar</button>
  </form>
</div>

<script src="/js/api.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("login-error");
    errorBox.style.display = "none";
    try {
      const user = await api.post("/api/auth/login", {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      if (user.role !== "ADMIN") throw new Error("Esta cuenta no tiene permisos de administrador");
      location.href = "/admin/dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message || "No se pudo iniciar sesión";
      errorBox.style.display = "block";
    }
  });
</script>
</body>
</html>
